<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>X投稿テンプレート</title>

  <style>
    :root {
      --red:#d90020;
      --pink:#fff1f3;
      --black:#171717;
      --gray:#f6f6f6;
    }

    * { box-sizing:border-box; }

    html {
      scroll-behavior:smooth;
    }

    body {
      margin:0;
      font-family:"Meiryo UI","Meiryo",sans-serif;
      color:var(--black);
      background:#fafafa;
    }

    .wrap {
      max-width:760px;
      margin:auto;
      padding:18px 14px 70px;
    }

    header {
      background:#fff;
      border-bottom:4px solid var(--red);
      padding:8px 0 18px;
    }

    h1 {
      margin:0;
      color:var(--red);
      font-size:28px;
    }

    .sub {
      margin:7px 0 0;
      font-size:13px;
    }

    .nav {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin:16px 0;
    }

    .nav a {
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:46px;
      text-decoration:none;
      color:#111;
      border:1.5px solid var(--red);
      border-radius:12px;
      background:#fff;
      font-weight:700;
      font-size:14px;
      text-align:center;
      padding:7px;
    }

    .nav a:hover {
      background:var(--pink);
    }

    .card {
      scroll-margin-top:10px;
      background:#fff;
      border:1px solid #eee;
      border-radius:16px;
      margin:16px 0;
      padding:15px;
      box-shadow:0 3px 12px #0000000a;
    }

    .card h2 {
      font-size:20px;
      margin:0 -15px 14px;
      padding:10px 15px;
      background:var(--pink);
      border-left:5px solid var(--red);
    }

    label {
      display:block;
      font-weight:700;
      font-size:13px;
      margin:11px 0 5px;
    }

    input,
    textarea {
      width:100%;
      border:1px solid #bbb;
      border-radius:9px;
      padding:11px;
      font:inherit;
      background:#fff;
    }

    textarea {
      min-height:76px;
      resize:vertical;
    }

    .grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .preview {
      white-space:pre-wrap;
      background:var(--gray);
      border-radius:10px;
      padding:13px;
      margin-top:13px;
      font-size:14px;
      line-height:1.65;
      overflow-wrap:anywhere;
    }

    .actions {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:10px;
    }

    button,
    .xbtn {
      border:0;
      border-radius:10px;
      min-height:44px;
      padding:9px 10px;
      font:inherit;
      font-weight:700;
      cursor:pointer;
      text-align:center;
    }

    .xbtn {
      background:var(--red);
      color:#fff;
      grid-column:1/-1;
    }

    .copy {
      background:#111;
      color:#fff;
    }

    .clear {
      background:#fff;
      color:#111;
      border:1px solid #aaa;
    }

    .note {
      font-size:12px;
      color:#666;
      margin:7px 0;
    }

    .wide {
      grid-column:1/-1;
    }

    .top-button {
      width:100%;
      background:var(--red);
      color:#fff;
      border:none;
      border-radius:12px;
      min-height:50px;
      font-weight:700;
      font-size:15px;
      cursor:pointer;
      margin-top:24px;
    }

    footer {
      text-align:right;
      font-size:11px;
      color:#666;
      margin-top:24px;
    }

    @media(max-width:430px) {
      h1 { font-size:24px; }

      .wrap {
        padding-left:10px;
        padding-right:10px;
      }

      .card {
        padding:13px;
      }

      .card h2 {
        margin-left:-13px;
        margin-right:-13px;
      }

      .grid {
        grid-template-columns:1fr;
      }

      .wide {
        grid-column:auto;
      }
    }
  </style>
</head>

<body>

  <div class="wrap" style="padding-bottom:0">
    <h1>X 投稿テンプレート</h1>
    <p class="sub">

<main class="wrap">

    type="button"

  history.scrollRestoration = "manual";
}

window.addEventListener("pageshow", () => {
  if (location.hash) {
    history.replaceState(
      null,
      "",
      location.pathname + location.search
    );
  }

  window.scrollTo(0,0);
});


/* 日付関係 */

const pad = n =>
  String(n).padStart(2,"0");

const now = () =>
  new Date();

const ymd = (d,slashPad=true) =>
  slashPad
    ? `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`
    : `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;

const md = d =>
  `${d.getMonth()+1}/${d.getDate()}`;

const addDays = (d,n) => {
  const x = new Date(d);
  x.setDate(x.getDate()+n);
  return x;
};

const tomorrow = () =>
  ymd(addDays(now(),1));


function nextWeek() {

  const d = now();
  const day = d.getDay();

  const daysToMon =
    day === 0 ? 1 : 8-day;

  const mon =
    addDays(d,daysToMon);

  const sun =
    addDays(mon,6);

  return `${ymd(mon,false)}～${ymd(sun,false)}`;
}


function monthRange() {

  const d = now();

  const last =
    new Date(
      d.getFullYear(),
      d.getMonth()+1,
      0
    );

  return `${d.getFullYear()}/${d.getMonth()+1}/1～${d.getFullYear()}/${d.getMonth()+1}/${last.getDate()}`;
}

/* =========================
   サイト動作
   ========================= */


function vals(t) {

  const o = {};

  t.fields.forEach(f=>{

    const el =
      document.querySelector(
        `#${t.id}-${f[0]}`
      );

    o[f[0]] =
      el
        ? el.value.trim()
        : "";

  });

  if(t.fixedUrl) {
    o.url=t.fixedUrl;
  }

  return o;
}



function update(t) {

  document.querySelector(
    `#p-${t.id}`
  ).textContent =
    t.build(vals(t));

}



function copyText(t) {

  const text =
    t.build(vals(t));

  navigator.clipboard
    .writeText(text)
    .then(()=>{

      const b =
        document.querySelector(
          `#c-${t.id}`
        );

      const old =
        b.textContent;

      b.textContent =
        "コピーしました ✓";

      setTimeout(
        ()=>b.textContent=old,
        1200
      );

    });

}



function clearFields(t) {

  t.fields.forEach(f=>{

    document.querySelector(
      `#${t.id}-${f[0]}`
    ).value="";

  });

  update(t);
}



function postX(t) {

  const text =
    t.build(vals(t));

  window.open(
    `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`,
    "_blank"
  );

}



function fieldHTML(t,f) {

  const [key,label,type] = f;

  const id =
    `${t.id}-${key}`;

  if(type==="textarea") {

    return `
      <div class="wide">

        <label for="${id}">
          ${label}
        </label>

        <textarea
          id="${id}"
          placeholder="${label}を入力">
        </textarea>

      </div>
    `;

  }

  return `
    <div>

      <label for="${id}">
        ${label}
      </label>

      <input
        id="${id}"
        type="${type==="url"?"url":"text"}"
        placeholder="${label}を入力">

    </div>
  `;

}



const nav =
  document.querySelector("#nav");

const cards =
  document.querySelector("#cards");



templates.forEach(t=>{


  /* 上部のジャンプボタン */

  nav.insertAdjacentHTML(
    "beforeend",
    `<a href="#${t.id}">
      ${t.title}
    </a>`
  );



  /* 各テンプレート */

  cards.insertAdjacentHTML(
    "beforeend",

    `<section
       class="card"
       id="${t.id}">

      <h2>
        ${t.title}
      </h2>

      <div class="grid">
        ${t.fields
          .map(f=>fieldHTML(t,f))
          .join("")}
      </div>

      ${
        t.fixedUrl
        ?
        `<p class="note">
          YouTube URLはテンプレートに固定済みです。
        </p>`
        :
        ""
      }

      <div
        class="preview"
        id="p-${t.id}">
      </div>

      <div class="actions">

        ${
          t.noX
          ?
          ""
          :
          `<button
             class="xbtn"
             id="x-${t.id}">
             Xで投稿
           </button>`
        }

        <button
          class="copy"
          id="c-${t.id}">
          全文コピー
        </button>

        <button
          class="clear"
          id="d-${t.id}">
          入力内容を消す
        </button>

      </div>

    </section>`
  );



  /* 入力したら即反映 */

  t.fields.forEach(f=>{

    document
      .querySelector(
        `#${t.id}-${f[0]}`
      )
      .addEventListener(
        "input",
        ()=>update(t)
      );

  });



  /* コピーボタン */

  document
    .querySelector(
      `#c-${t.id}`
    )
    .onclick =
      ()=>copyText(t);



  /* 消去ボタン */

  document
    .querySelector(
      `#d-${t.id}`
    )
    .onclick =
      ()=>clearFields(t);



  /* X投稿 */

  if(!t.noX) {

    document
      .querySelector(
        `#x-${t.id}`
      )
      .onclick =
        ()=>postX(t);

  }



  /* 初期表示 */

  update(t);

});


/* 念のため読み込み完了後もトップへ */

window.addEventListener(
  "load",

    setTimeout(
